<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>visualizer.js harness</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  #stage { position: relative; width: 800px; }
  #status { font-weight: bold; font-size: 1.2em; }
  .pass { color: green; } .fail { color: red; }
  label { display: inline-block; width: 120px; }
</style>
</head>
<body>
<h1>visualizer.js harness</h1>
<p id="status">running…</p>
<div>
  <label>Scale</label><input id="scale" type="range" min="0.3" max="3" step="0.05" value="1">
  <label>Rotation</label><input id="rot" type="range" min="0" max="90" step="1" value="0">
  <label>Compare</label><input id="cmp" type="range" min="0" max="100" step="1" value="0">
</div>
<div id="stage"></div>
<script src="../../src/NaturalStoneImpex.Client/wwwroot/js/visualizer.js"></script>
<script>
(async function () {
  const failures = [];
  const assert = (cond, msg) => { if (!cond) failures.push(msg); };
  const near = (a, b, eps) => Math.abs(a - b) < (eps || 1e-6);

  try {
    const viz = window.nsiVisualizer;
    assert(!!viz, "module loaded");

    // --- homography math ---
    // Identity: unit square -> unit square
    const sq = [0,0, 1,0, 1,1, 0,1];
    const hI = viz._test.computeHomography(sq, sq);
    const p = viz._test.applyH(hI, 0.5, 0.5);
    assert(near(p[0], 0.5) && near(p[1], 0.5), "identity homography");

    // Known projective map: square -> trapezoid; corners must map exactly
    const dst = [100,50, 700,80, 780,560, 40,540];
    const h = viz._test.computeHomography(sq, dst);
    const corners = [[0,0],[1,0],[1,1],[0,1]];
    corners.forEach((c, i) => {
      const q = viz._test.applyH(h, c[0], c[1]);
      assert(near(q[0], dst[i*2], 1e-3) && near(q[1], dst[i*2+1], 1e-3), "corner " + i + " maps exactly");
    });

    // --- rendering (visual) ---
    const forceFallback = new URLSearchParams(location.search).has("fallback");
    const mode = viz.init("stage", null, { forceFallback });
    document.title += forceFallback ? " (canvas-2d)" : (mode.webgl ? " (webgl)" : " (canvas-2d auto)");
    if (!forceFallback) {
      assert(mode.webgl, "WebGL context initialized (headless)");
    }

    // Procedural photo: sky + green + gray trapezoid "driveway", 1200x900
    const photo = document.createElement("canvas");
    photo.width = 1200; photo.height = 900;
    const pctx = photo.getContext("2d");
    pctx.fillStyle = "#9ec3e6"; pctx.fillRect(0, 0, 1200, 380);
    pctx.fillStyle = "#5e9a4e"; pctx.fillRect(0, 380, 1200, 520);
    pctx.fillStyle = "#8a8a86";
    pctx.beginPath();
    pctx.moveTo(430, 400); pctx.lineTo(760, 400); pctx.lineTo(1050, 880); pctx.lineTo(180, 880);
    pctx.closePath(); pctx.fill();
    // add a dark "shadow" band to verify luminance transfer
    pctx.fillStyle = "rgba(20,20,30,0.45)";
    pctx.fillRect(150, 600, 1050, 120);
    await viz.loadPhotoFromDataUrl(photo.toDataURL("image/png"));

    // Procedural mask = same trapezoid, white on black
    const mask = document.createElement("canvas");
    mask.width = 1200; mask.height = 900;
    const mctx = mask.getContext("2d");
    mctx.fillStyle = "#000"; mctx.fillRect(0, 0, 1200, 900);
    mctx.fillStyle = "#fff";
    mctx.beginPath();
    mctx.moveTo(430, 400); mctx.lineTo(760, 400); mctx.lineTo(1050, 880); mctx.lineTo(180, 880);
    mctx.closePath(); mctx.fill();
    await viz.setMaskPng(mask.toDataURL("image/png").split(",")[1]);
    assert(viz.hasMask(), "mask registered");

    const def = viz.defaultCornersFromMask();
    assert(def.length === 8, "default corners has 8 values");
    assert(def[7] > def[1], "bottom corners below top corners");
    viz.setCorners(def);

    // Procedural stone texture
    const tile = document.createElement("canvas");
    tile.width = 256; tile.height = 256;
    const tctx = tile.getContext("2d");
    tctx.fillStyle = "#b8b0a0"; tctx.fillRect(0, 0, 256, 256);
    tctx.strokeStyle = "#6b6458"; tctx.lineWidth = 6;
    for (let i = 0; i <= 2; i++) {
      tctx.beginPath(); tctx.moveTo(0, i * 128); tctx.lineTo(256, i * 128); tctx.stroke();
      tctx.beginPath(); tctx.moveTo(i * 128, 0); tctx.lineTo(i * 128, 256); tctx.stroke();
    }
    await viz.setProductTexture(tile.toDataURL("image/png"), 1.0);
    viz.render();

    const dataUrl = viz.exportResultDataUrl();
    assert(dataUrl.startsWith("data:image/jpeg"), "export produces jpeg data url");

    // --- interaction layer ---
    assert(typeof viz.setMode === "function", "setMode exists");
    assert(typeof viz.setBrushSize === "function", "setBrushSize exists");
    // brush stroke programmatically: paint a square patch and verify the mask grew
    const internals = viz._internal();
    const before = internals.maskCanvas.getContext("2d")
      .getImageData(60, 420, 1, 1).data[0];
    viz.setMode("brush");
    viz.setBrushSize(60);
    viz._test.strokeForTest(60, 420);
    const after = internals.maskCanvas.getContext("2d")
      .getImageData(60, 420, 1, 1).data[0];
    assert(before < 128 && after > 128, "brush paints the mask");
    viz.setMode(null);

    // --- pixel-level render assertions (headless-safe substitute for eyeballing) ---
    // Same three checks on both render paths: WebGL (readPixels, bottom-left origin)
    // and canvas-2D fallback (getImageData, top-left origin, glCanvas reused as 2D).
    {
      const internal = viz._internal();
      const rCanvas = internal.glCanvas;
      const W = internal.size.w, H = internal.size.h;
      const lum = (px) => 0.299*px.r + 0.587*px.g + 0.114*px.b;
      const tag = mode.webgl ? "" : "fallback: ";
      var readBlock;

      if (mode.webgl) {
        const rgl = rCanvas.getContext("webgl");
        // Read an averaged block of pixels so we are robust against landing on a
        // grid line vs. fill color of the procedural stone tile. Coordinates are
        // in top-left "photo pixel" space; WebGL readPixels is bottom-left origin,
        // so flip Y.
        readBlock = (cx, cy, half) => {
          const x0 = Math.max(0, cx - half);
          const y0 = Math.max(0, (H - 1 - cy) - half);
          const w = Math.min(2 * half + 1, W - x0);
          const hgt = Math.min(2 * half + 1, H - y0);
          const buf = new Uint8Array(w * hgt * 4);
          rgl.readPixels(x0, y0, w, hgt, rgl.RGBA, rgl.UNSIGNED_BYTE, buf);
          let r = 0, g = 0, b = 0, a = 0;
          const n = w * hgt;
          for (let i = 0; i < n; i++) { r += buf[i*4]; g += buf[i*4+1]; b += buf[i*4+2]; a += buf[i*4+3]; }
          return { r: r/n, g: g/n, b: b/n, a: a/n };
        };
      } else {
        // Fallback path: glCanvas was used as a 2D canvas by _renderFallback(), so
        // read it back with getImageData. Already top-left origin — no Y flip needed.
        const rctx = rCanvas.getContext("2d");
        readBlock = (cx, cy, half) => {
          const x0 = Math.max(0, cx - half);
          const y0 = Math.max(0, cy - half);
          const w = Math.min(2 * half + 1, W - x0);
          const hgt = Math.min(2 * half + 1, H - y0);
          const data = rctx.getImageData(x0, y0, w, hgt).data;
          let r = 0, g = 0, b = 0, a = 0;
          const n = w * hgt;
          for (let i = 0; i < n; i++) { r += data[i*4]; g += data[i*4+1]; b += data[i*4+2]; a += data[i*4+3]; }
          return { r: r/n, g: g/n, b: b/n, a: a/n };
        };
      }

      // (a) well inside the masked trapezoid, in the lit (non-shadow) region:
      // texture must be drawn (alpha > 0) and must not just be the flat driveway gray.
      const litPx = readBlock(600, 800, 25);
      assert(litPx.a > 0, tag + "lit masked pixel has alpha > 0 (texture drawn)");
      const isFlatGray = near(litPx.r, 138, 6) && near(litPx.g, 138, 6) && near(litPx.b, 134, 6);
      assert(!isFlatGray, tag + "lit masked pixel differs from flat driveway gray (stone texture actually drawn)");

      // (b) well outside the mask (sky region): alpha must be 0 (allow a hair of
      // fallback feathering tolerance since the mask is blurred before clipping).
      const outsidePx = readBlock(50, 50, 5);
      assert(mode.webgl ? outsidePx.a === 0 : outsidePx.a < 2, tag + "pixel outside mask has alpha ~0");

      // (c) inside the mask AND inside the dark shadow band: must be darker than
      // the lit masked pixel above (luminance transfer working).
      const shadowPx = readBlock(600, 660, 25);
      assert(shadowPx.a > 0, tag + "shadow-band masked pixel has alpha > 0");
      assert(lum(shadowPx) < lum(litPx), tag + "shadow band pixel is darker than lit masked pixel (luminance transfer)");
    }

    // --- mid-stroke tool switch (regression) ---
    // setMode(null) while a pointer is down must COMMIT the live stroke (paint at
    // the first point sticks) and stop further painting (second point untouched).
    // Uses synthetic PointerEvents on the edit canvas; photo-px -> client coords
    // via the photo element's bounding rect (photo is 1200x900 natural).
    try {
      const strokeInternals = viz._internal();
      const editC = strokeInternals.editCanvas;
      const photoRect = strokeInternals.photoImg.getBoundingClientRect();
      const firePointer = (type, px, py) => {
        editC.dispatchEvent(new PointerEvent(type, {
          pointerId: 7, bubbles: true, cancelable: true,
          clientX: photoRect.left + px / 1200 * photoRect.width,
          clientY: photoRect.top + py / 900 * photoRect.height
        }));
      };
      const maskPx = (x, y) => strokeInternals.maskCanvas.getContext("2d")
        .getImageData(x, y, 1, 1).data[0];
      // Both points lie OUTSIDE the mask trapezoid (430,400 760,400 1050,880 180,880):
      // left edge at y=800 is x~222 (brush r=30 spans [70,130]); right edge at
      // y=500 is x~820 (brush spans [1070,1130]).
      assert(maskPx(100, 800) < 128, "mid-stroke: first point starts unselected");
      assert(maskPx(1100, 500) < 128, "mid-stroke: second point starts unselected");
      viz.setMode("brush");
      viz.setBrushSize(60);
      firePointer("pointerdown", 100, 800);
      firePointer("pointermove", 100, 800);
      viz.setMode(null);                     // tool switch mid-stroke: commits stroke
      firePointer("pointermove", 1100, 500); // must NOT paint after the switch
      firePointer("pointerup", 1100, 500);
      assert(maskPx(100, 800) > 128, "mid-stroke: stroke committed on tool switch (first point painted)");
      assert(maskPx(1100, 500) < 128, "mid-stroke: no stray painting after tool switch (second point clean)");
    } catch (e) {
      failures.push("mid-stroke tool switch threw: " + e.message);
    }

    // --- dispose / re-init lifecycle ---
    // After dispose() + init(), all engine state must be reset: no stale mask,
    // and render() must be a safe no-op (guards on reset state), not a throw.
    // Runs last: it leaves the stage re-initialized without a photo, which is
    // fine because all visual/pixel assertions above have already completed.
    viz.dispose();
    viz.init("stage", null, { forceFallback: false });
    assert(viz.hasMask() === false, "hasMask() is false after dispose + re-init");
    try {
      viz.render();
    } catch (e) {
      failures.push("render() after dispose + re-init threw: " + e.message);
    }

    document.getElementById("scale").oninput = e => { viz.setScale(parseFloat(e.target.value)); viz.render(); };
    document.getElementById("rot").oninput = e => { viz.setRotation(parseFloat(e.target.value)); viz.render(); };
    document.getElementById("cmp").oninput = e => viz.setCompareRatio(parseFloat(e.target.value));
  } catch (err) {
    failures.push("exception: " + err.message);
    console.error(err);
  }

  const status = document.getElementById("status");
  if (failures.length === 0) {
    status.textContent = "ALL PASS — now verify visually: stones must recede with perspective, shadow band must remain visible on the stones.";
    status.className = "pass";
  } else {
    status.textContent = "FAIL: " + failures.join("; ");
    status.className = "fail";
  }
})();
</script>
</body>
</html>
